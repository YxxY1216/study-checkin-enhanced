<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日学习打卡 · 增强版</title>
    <script src="api.js"></script>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-light: #EEF2FF;
            --success: #10B981;
            --success-light: #ECFDF5;
            --warning: #F59E0B;
            --danger: #EF4444;
            --gray-50: #F8FAFC;
            --gray-100: #F1F5F9;
            --gray-200: #E2E8F0;
            --gray-300: #CBD5E1;
            --gray-400: #94A3B8;
            --gray-500: #64748B;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1E293B;
            --radius: 10px;
            --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 12px rgba(0,0,0,0.05);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--gray-100);
            color: var(--gray-800);
            min-height: 100vh;
        }

        /* ── Layout ── */
        .layout {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px 20px 40px;
        }
        .left-panel { flex: 1; min-width: 0; }
        .right-panel {
            width: 340px;
            flex-shrink: 0;
            position: sticky;
            top: 16px;
            max-height: calc(100vh - 32px);
            overflow-y: auto;
        }

        /* ── Header ── */
        .header {
            background: linear-gradient(135deg, #4F46E5, #7C3AED, #A855F7);
            color: white;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(79,70,229,0.25);
            flex-wrap: wrap;
            gap: 8px;
        }
        .header-left h1 { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; }
        .header-date { font-size: 13px; opacity: 0.85; margin-top: 1px; }

        /* Streak badge */
        .streak-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(255,255,255,0.18);
            border-radius: 20px;
            padding: 3px 10px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 8px;
        }
        .streak-badge .fire { font-size: 12px; }

        /* Exam countdown */
        .countdown-box {
            background: rgba(255,255,255,0.15);
            border-radius: 8px;
            padding: 4px 12px;
            text-align: center;
        }
        .countdown-num { font-size: 16px; font-weight: 700; line-height: 1.2; }
        .countdown-label { font-size: 10px; opacity: 0.85; }

        .header-stats { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .stat-box {
            text-align: center;
            background: rgba(255,255,255,0.15);
            border-radius: 8px;
            padding: 4px 12px;
            min-width: 52px;
        }
        .stat-box .num { font-size: 18px; font-weight: 700; line-height: 1.2; }
        .stat-box .lbl { font-size: 10px; opacity: 0.85; }

        /* ── Subject Card ── */
        .subject-card {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 12px;
            overflow: hidden;
        }
        .subject-header {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .subject-header:hover { background: var(--gray-50); }
        .subject-icon {
            width: 28px; height: 28px;
            border-radius: 7px;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }
        .subject-info { flex: 1; min-width: 0; }
        .subject-name-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }
        .subject-name { font-size: 14px; font-weight: 600; }
        .subject-progress-text { font-size: 11px; color: var(--gray-400); }

        /* Progress bar */
        .progress-bar-track {
            height: 4px;
            background: var(--gray-200);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 4px;
        }
        .progress-bar-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.4s ease;
        }

        .subject-arrow { color: var(--gray-300); font-size: 13px; transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1); flex-shrink: 0; }
        .subject-card.open .subject-arrow { transform: rotate(180deg); }
        .add-task-btn {
            background: rgba(255,255,255,0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1.5px dashed var(--gray-300);
            color: var(--gray-400); border-radius: 8px;
            padding: 3px 10px; font-size: 11px; cursor: pointer;
            transition: all 0.2s; flex-shrink: 0;
        }
        .add-task-btn:hover { border-color: var(--primary); color: var(--primary); background: rgba(79,70,229,0.08); }

        /* ── Task List (animated) ── */
        .task-list {
            max-height: 0;
            overflow: hidden;
            padding: 0 10px;
            transition: max-height 0.4s cubic-bezier(0.4,0,0.2,1), padding 0.4s cubic-bezier(0.4,0,0.2,1);
        }
        .subject-card.open .task-list {
            max-height: 600px;
            padding: 4px 10px 10px;
        }

        .task-item {
            background: var(--gray-50);
            border: 1px solid var(--gray-200);
            border-radius: 9px;
            padding: 10px 12px;
            margin-bottom: 6px;
            transition: all 0.2s;
        }
        .task-item.completed { background: var(--success-light); border-color: #A7F3D0; }
        .task-top { display: flex; align-items: center; gap: 6px; }
        .task-name {
            font-size: 13px; font-weight: 500; color: var(--gray-700); flex: 1;
        }
        .task-item.completed .task-name { text-decoration: line-through; color: var(--gray-400); }
        .task-edit-btn, .task-delete-btn {
            background: none; border: none; cursor: pointer;
            font-size: 13px; padding: 2px 4px; transition: all 0.15s;
            border-radius: 4px;
        }
        .task-edit-btn { color: var(--gray-300); }
        .task-edit-btn:hover { color: var(--primary); background: var(--primary-light); }
        .task-delete-btn { color: var(--gray-300); }
        .task-delete-btn:hover { color: var(--danger); background: #FEF2F2; }

        /* Time Select */
        .time-select-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            margin-top: 8px;
        }
        .time-select-col { display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .time-select-label { font-size: 9px; color: var(--gray-400); font-weight: 600; letter-spacing: 0.3px; }
        .time-select {
            width: 52px; height: 30px;
            border: 1.5px solid var(--gray-200); border-radius: 6px;
            background: white; font-size: 14px; font-weight: 600;
            color: var(--gray-700); text-align: center; cursor: pointer;
            outline: none; transition: border-color 0.15s;
            appearance: none; -webkit-appearance: none;
        }
        .time-select:focus { border-color: var(--primary); }
        .time-sep { font-size: 16px; font-weight: 700; color: var(--primary); padding-top: 4px; }

        /* Action Row */
        .task-action {
            display: flex; align-items: center; justify-content: space-between;
            margin-top: 8px;
        }
        .time-show { font-size: 12px; color: var(--gray-500); display: flex; align-items: center; gap: 3px; }
        .btn {
            padding: 6px 14px; border-radius: 10px; font-size: 12px; font-weight: 600;
            border: none; cursor: pointer; transition: all 0.2s;
            display: inline-flex; align-items: center; gap: 4px;
            background: rgba(255,255,255,0.55);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 1px 4px rgba(0,0,0,0.06), inset 0 0.5px 0 rgba(255,255,255,0.6);
        }
        .btn:active { transform: scale(0.95); }
        .btn-primary   { background: var(--primary); color: white; }
        .btn-primary:hover { background: #4338CA; }
        .btn-success   { background: var(--success); color: white; }
        .btn-outline   { background: white; color: var(--gray-600); border: 1.5px solid var(--gray-200); }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
        .btn-danger-outline { background: white; color: var(--danger); border: 1.5px solid #FECACA; }
        .btn-danger-outline:hover { background: #FEF2F2; }
        .btn-sm { padding: 4px 10px; font-size: 11px; }

        /* ── Modal ── */
        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.4); z-index: 200;
            align-items: center; justify-content: center;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: white; border-radius: 14px; padding: 24px;
            width: 90%; max-width: 380px; box-shadow: 0 16px 48px rgba(0,0,0,0.2);
        }
        .modal h3 { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
        .modal input[type="text"] {
            width: 100%; padding: 9px 12px; border: 1.5px solid var(--gray-200);
            border-radius: 8px; font-size: 14px; outline: none;
            transition: border-color 0.15s;
        }
        .modal input[type="text"]:focus { border-color: var(--primary); }
        .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
        .modal-confirm-del { background: var(--danger); color: white; }
        .modal-confirm-del:hover { background: #DC2626; }

        /* ── Right Panel ── */
        .right-card {
            background: white; border-radius: var(--radius);
            box-shadow: var(--shadow); padding: 16px; margin-bottom: 12px;
        }
        .right-card-title {
            font-size: 13px; font-weight: 600; color: var(--gray-500);
            text-transform: uppercase; letter-spacing: 0.5px;
            margin-bottom: 12px; display: flex; align-items: center; gap: 6px;
        }

        /* Calendar */
        .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .cal-nav-left { display: flex; align-items: center; gap: 6px; }
        .cal-nav-btn {
            background: var(--gray-100); border: none; border-radius: 6px;
            width: 24px; height: 24px; cursor: pointer; font-size: 12px;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s;
        }
        .cal-nav-btn:hover { background: var(--gray-200); }
        .cal-month-label { font-size: 14px; font-weight: 600; color: var(--gray-700); }
        .cal-week-btn {
            background: var(--primary); color: white; border: none; border-radius: 6px;
            padding: 4px 10px; font-size: 11px; font-weight: 600; cursor: pointer;
            transition: background 0.15s;
        }
        .cal-week-btn:hover { background: #4338CA; }
        .cal-week-btn.active { background: #7C3AED; box-shadow: 0 0 0 2px rgba(124,58,237,0.3); }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
        .cal-day-header {
            text-align: center; font-size: 10px; font-weight: 600;
            color: var(--gray-400); padding: 4px 0;
        }
        .cal-day {
            text-align: center; font-size: 12px; padding: 5px 2px;
            border-radius: 6px; cursor: pointer; transition: all 0.12s;
            color: var(--gray-600); position: relative;
        }
        .cal-day:hover { background: var(--gray-100); }
        .cal-day.other-month { color: var(--gray-300); }
        .cal-day.today { background: var(--primary); color: white; font-weight: 700; }
        .cal-day.today:hover { background: #4338CA; }
        .cal-day.has-data::after {
            content: ''; position: absolute; bottom: 2px; left: 50%;
            transform: translateX(-50%); width: 4px; height: 4px;
            border-radius: 50%; background: var(--success);
        }
        .cal-day.selected { outline: 2px solid var(--primary); outline-offset: -2px; }
        .cal-day.selected.today { outline: 2px solid white; }

        /* Legend */
        .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .legend-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--gray-600); }
        .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

        /* Bar Chart */
        .bar-chart { width: 100%; }
        .bar-total { text-align: center; margin-bottom: 12px; }
        .bar-total .total-hours { font-size: 26px; font-weight: 700; color: var(--gray-800); line-height: 1.1; }
        .bar-total .total-label { font-size: 11px; color: var(--gray-400); }
        .bar-row {
            display: flex; align-items: center; gap: 8px;
            padding: 7px 0; border-bottom: 1px solid var(--gray-100);
        }
        .bar-row:last-child { border-bottom: none; }
        .bar-label { width: 52px; font-size: 12px; color: var(--gray-600); display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
        .bar-track {
            flex: 1; height: 18px; background: var(--gray-100);
            border-radius: 4px; overflow: hidden;
        }
        .bar-fill {
            height: 100%; border-radius: 4px;
            transition: width 0.5s ease;
            display: flex; align-items: center; justify-content: flex-end;
            padding-right: 6px; min-width: 0;
        }
        .bar-fill span { font-size: 10px; color: white; font-weight: 600; white-space: nowrap; }
        .bar-time { width: 42px; font-size: 11px; color: var(--gray-500); text-align: right; flex-shrink: 0; }
        .chart-no-data {
            text-align: center; padding: 20px 0;
            color: var(--gray-400); font-size: 13px;
        }

        /* History mini list */
        .hist-mini-item {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 0; border-bottom: 1px solid var(--gray-100);
            cursor: pointer; font-size: 12px;
        }
        .hist-mini-item:last-child { border-bottom: none; }
        .hist-mini-item:hover .hist-mini-date { color: var(--primary); }
        .hist-mini-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
        .hist-mini-date { color: var(--gray-600); font-weight: 500; }
        .hist-mini-meta { color: var(--gray-400); margin-left: auto; }

        /* ── Trend Chart ── */
        .trend-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
        .trend-tab {
            padding: 4px 12px; border-radius: 6px; font-size: 11px; font-weight: 600;
            border: 1.5px solid var(--gray-200); background: white; color: var(--gray-500);
            cursor: pointer; transition: all 0.15s;
        }
        .trend-tab.active { background: var(--primary); color: white; border-color: var(--primary); }
        .trend-svg { width: 100%; height: 130px; }
        .trend-grid-line { stroke: var(--gray-200); stroke-width: 1; }
        .trend-line { fill: none; stroke: var(--primary); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
        .trend-dot { fill: var(--primary); stroke: white; stroke-width: 2; cursor: pointer; }
        .trend-label { font-size: 10px; fill: var(--gray-400); text-anchor: middle; }
        .trend-axis-label { font-size: 9px; fill: var(--gray-400); }
        .trend-tooltip {
            position: absolute; display: none;
            background: var(--gray-800); color: white;
            padding: 4px 8px; border-radius: 5px;
            font-size: 11px; font-weight: 600;
            pointer-events: none; white-space: nowrap;
            z-index: 10;
        }
        .trend-chart-wrap { position: relative; }

        /* ── Settings / Export-Import ── */
        .settings-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .settings-btn {
            flex: 1;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            border: 1.5px solid var(--gray-200);
            background: white;
            color: var(--gray-600);
            cursor: pointer;
            transition: all 0.15s;
            text-align: center;
        }
        .settings-btn:hover { border-color: var(--primary); color: var(--primary); }
        .settings-btn.danger:hover { border-color: var(--danger); color: var(--danger); }

        /* Toast */
        .toast {
            position: fixed; bottom: 24px; left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--gray-800); color: white;
            padding: 9px 18px; border-radius: 9px;
            font-size: 13px; font-weight: 500; z-index: 999;
            transition: transform 0.28s ease; white-space: nowrap;
            box-shadow: 0 6px 20px rgba(0,0,0,0.18);
        }
        .toast.show { transform: translateX(-50%) translateY(0); }

        /* Reminder setting */
        .reminder-row {
            display: flex; align-items: center; gap: 8px;
            font-size: 12px; color: var(--gray-600); margin-top: 8px;
        }
        .reminder-row input[type="time"] {
            padding: 3px 6px; border: 1.5px solid var(--gray-200);
            border-radius: 6px; font-size: 12px;
        }
        .reminder-toggle {
            display: flex; align-items: center; gap: 4px; cursor: pointer;
            font-size: 12px; color: var(--gray-500);
        }
        .reminder-toggle input { cursor: pointer; }

        @media (max-width: 860px) {
            .layout { flex-direction: column; }
            .right-panel { width: 100%; position: static; max-height: none; }
            .header { flex-direction: column; align-items: flex-start; }
            .header-stats { margin-top: 8px; }
        }
    </style>
</head>
<body>

<!-- Header -->
<div class="header">
    <div class="header-left">
        <h1>📚 每日学习打卡 <span class="streak-badge" id="streakBadge"><span class="fire">🔥</span><span id="streakNum">0</span> 天连续</span></h1>
        <div class="header-date" id="todayDisplay"></div>
    </div>
    <div class="header-stats">
        <div class="countdown-box">
            <div class="countdown-num" id="countdownNum">--</div>
            <div class="countdown-label">距考研</div>
        </div>
        <div class="stat-box"><div class="num" id="statDone">0</div><div class="lbl">已完成</div></div>
        <div class="stat-box"><div class="num" id="statTotal">0</div><div class="lbl">总任务</div></div>
        <div class="stat-box"><div class="num" id="statTime">0:00</div><div class="lbl">学习时长</div></div>
    </div>
</div>

<!-- Main Layout -->
<div class="layout">
    <!-- Left Panel -->
    <div class="left-panel" id="leftPanel"></div>

    <!-- Right Panel -->
    <div class="right-panel">
        <!-- Calendar -->
        <div class="right-card">
            <div class="right-card-title">📅 日历</div>
            <div class="cal-nav">
                <button class="cal-nav-btn" onclick="changeMonth(-1)">◀</button>
                <span class="cal-month-label" id="calMonthLabel"></span>
                <button class="cal-nav-btn" onclick="changeMonth(1)">▶</button>
                <button class="cal-week-btn" id="weekBtn" onclick="toggleWeekView()">看上周</button>
            </div>
            <div class="cal-grid" id="calGrid"></div>
            <div class="legend" id="calLegend"></div>
        </div>

        <!-- Donut Chart -->
        <div class="right-card">
            <div class="right-card-title">⏱️ 学习时间 <span id="chartDateLabel" style="font-size:11px;color:var(--gray-400);font-weight:400;text-transform:none;"></span></div>
            <div class="chart-container" id="chartContainer">
                <div class="chart-no-data">选择日期查看学习时间分布</div>
            </div>
        </div>

        <!-- Trend Chart -->
        <div class="right-card">
            <div class="right-card-title">📈 学习趋势</div>
            <div class="trend-tabs">
                <button class="trend-tab active" id="trend7Btn" onclick="setTrendRange(7)">近7天</button>
                <button class="trend-tab" id="trend30Btn" onclick="setTrendRange(30)">近30天</button>
            </div>
            <div class="trend-chart-wrap">
                <svg class="trend-svg" id="trendSvg" viewBox="0 0 300 130"></svg>
                <div class="trend-tooltip" id="trendTooltip"></div>
            </div>
        </div>

        <!-- History -->
        <div class="right-card">
            <div class="right-card-title">📋 最近记录</div>
            <div id="histMiniContainer"></div>
        </div>

        <!-- Settings -->
        <div class="right-card">
            <div class="right-card-title">⚙️ 设置</div>
            <div class="settings-row">
                <button class="settings-btn" onclick="exportData()">💾 导出数据</button>
                <button class="settings-btn" onclick="document.getElementById('importFile').click()">📂 导入数据</button>
                <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
            </div>
            <div class="reminder-row">
                <label class="reminder-toggle">
                    <input type="checkbox" id="reminderToggle" onchange="toggleReminder()">
                    每日提醒
                </label>
                <input type="time" id="reminderTime" value="22:00" onchange="saveReminder()">
            </div>
            <div style="font-size:11px;color:var(--gray-400);margin-top:4px;" id="reminderStatus"></div>
        </div>
    </div>
</div>

<!-- Add/Edit Task Modal -->
<div class="modal-overlay" id="taskModal">
    <div class="modal">
        <h3 id="modalTitle">新增任务</h3>
        <input type="text" id="modalInput" placeholder="请输入任务名称…" maxlength="60" />
        <div class="modal-actions">
            <button class="btn btn-outline" onclick="closeModal()">取消</button>
            <button class="btn btn-primary" id="modalConfirm">确认</button>
        </div>
    </div>
</div>

<!-- Delete Confirm Modal -->
<div class="modal-overlay" id="deleteModal">
    <div class="modal">
        <h3>⚠️ 确认删除</h3>
        <p style="font-size:13px;color:var(--gray-500);line-height:1.6;" id="deleteMsg"></p>
        <div class="modal-actions">
            <button class="btn btn-outline" onclick="closeDeleteModal()">取消</button>
            <button class="btn modal-confirm-del" id="deleteConfirmBtn">删除</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════════
   DATA
═══════════════════════════════════════════ */
const SUBJECTS = [
    { id:'english', name:'英语', icon:'🇬🇧', color:'#EF4444',
      tasks:['背诵200个单词','完成1篇阅读 + 复盘，顺带复习单词','学习一节作文课','整体复盘英语内容'] },
    { id:'math',    name:'数学', icon:'📐', color:'#3B82F6',
      tasks:['强化课程学习（收尾阶段，配套1000题）','刷1000题','线代强化学习'] },
    { id:'politics',name:'政治', icon:'📖', color:'#F59E0B',
      tasks:['背诵key考点'] },
    { id:'c',       name:'C语言', icon:'💻', color:'#10B981',
      tasks:['课程回顾复盘','刷真题','代码练习'] }
];

let calYear, calMonth, selectedDate;
let trendRange = 7;
let weekViewMode = false; // 是否处于"看上周"模式

// Exam date: 考研 usually Dec 20-22
const EXAM_DATE = new Date('2026-12-20');

/* ═══════════════════════════════════════════
   STORAGE
═══════════════════════════════════════════ */
function todayKey() { return new Date().toISOString().slice(0,10); }

function loadToday() {
    const raw = localStorage.getItem('checkin_' + todayKey());
    if (raw) return JSON.parse(raw);
    const data = {};
    SUBJECTS.forEach(s => s.tasks.forEach((_,i) => {
        data[`${s.id}_${i}`] = { completed:false, time:'0:00' };
    }));
    return data;
}
function saveToday(d) { localStorage.setItem('checkin_'+todayKey(), JSON.stringify(d)); }

function loadHistory() {
    const r = localStorage.getItem('checkin_history');
    return r ? JSON.parse(r) : [];
}
function saveHistory(h) { localStorage.setItem('checkin_history', JSON.stringify(h)); }

function loadStreak() {
    const r = localStorage.getItem('checkin_streak');
    return r ? JSON.parse(r) : { current:0, best:0, lastDate:null };
}
function saveStreak(s) { localStorage.setItem('checkin_streak', JSON.stringify(s)); }

function archiveDay(key, data) {
    let h = loadHistory();
    const idx = h.findIndex(x => x.date === key);
    if (idx >= 0) { h[idx] = { ...h[idx], data, updatedAt: new Date().toISOString() }; }
    else { h.unshift({ date:key, data, createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() }); }
    while (h.length > 120) h.pop();
    saveHistory(h);
}

/* ═══════════════════════════════════════════
   STREAK CALCULATION
═══════════════════════════════════════════ */
function updateStreak() {
    const history = loadHistory();
    const streak = loadStreak();
    const today = todayKey();
    const yesterday = new Date(Date.now()-86400000).toISOString().slice(0,10);
    const dayBefore = new Date(Date.now()-172800000).toISOString().slice(0,10);

    // Check if today is a study day (any task completed in today's data or history)
    const todayRecord = history.find(h => h.date === today);
    const todayDone = todayRecord ? Object.values(todayRecord.data).some(d => d.completed) : false;
    const liveDone = Object.values(loadToday()).some(d => d.completed);

    // Build set of active study days
    const activeDays = new Set();
    if (todayDone || liveDone) activeDays.add(today);
    history.forEach(h => {
        const done = Object.values(h.data).some(d => d.completed);
        if (done) activeDays.add(h.date);
    });

    let current = 0;
    let checkDate = new Date(today + 'T00:00:00');
    // Walk backwards
    while (true) {
        const ds = checkDate.toISOString().slice(0,10);
        if (activeDays.has(ds)) {
            current++;
            checkDate.setDate(checkDate.getDate() - 1);
        } else {
            break;
        }
    }

    if (current > streak.best) {
        streak.best = current;
    }
    streak.current = current;
    streak.lastDate = today;
    saveStreak(streak);
    return streak;
}

/* ═══════════════════════════════════════════
   RENDER TASKS
═══════════════════════════════════════════ */
function buildTimeSelect(tid, suffix, initVal, maxVal) {
    const id = `sel_${tid}_${suffix}`;
    let opts = '';
    for (let i = 0; i <= maxVal; i++) {
        const v = suffix === 'h' ? i : String(i).padStart(2,'0');
        opts += `<option value="${i}" ${i===initVal?'selected':''}>${v}</option>`;
    }
    return `<select class="time-select" id="${id}" onchange="onTimeChange('${tid}','${suffix}',this.value)">${opts}</select>`;
}

function onTimeChange(tid, suffix, val) {
    const h = suffix==='h' ? parseInt(val) : getHour(tid);
    const m = suffix==='m' ? parseInt(val) : getMin(tid);
    updateTime(tid, h, m);
    if (selectedDate === todayKey()) renderChart(selectedDate);
}

function renderTasks() {
    const data = loadToday();
    const el = document.getElementById('leftPanel');
    let totalTasks = 0;
    let html = '';

    SUBJECTS.forEach(sub => {
        const tasksHtml = sub.tasks.map((task, ti) => {
            const tid = `${sub.id}_${ti}`;
            totalTasks++;
            const d = data[tid]||{completed:false,time:'0:00'};
            const [h,m] = d.time.split(':').map(Number);
            return `
            <div class="task-item ${d.completed?'completed':''}" id="task_${tid}">
                <div class="task-top">
                    <span class="task-name">${esc(task)}</span>
                    <button class="task-edit-btn" onclick="editTask('${sub.id}',${ti})" title="编辑">✏️</button>
                    <button class="task-delete-btn" onclick="deleteTask('${sub.id}',${ti})" title="删除">🗑️</button>
                </div>
                <div class="time-select-row">
                    <div class="time-select-col">
                        <span class="time-select-label">小时</span>
                        ${buildTimeSelect(tid,'h',h,23)}
                    </div>
                    <span class="time-sep">:</span>
                    <div class="time-select-col">
                        <span class="time-select-label">分钟</span>
                        ${buildTimeSelect(tid,'m',m,59)}
                    </div>
                </div>
                <div class="task-action">
                    <span class="time-show">⏱️ <span class="tv">${esc(d.time)}</span></span>
                    <div style="display:flex;gap:5px;">
                        ${d.completed
                            ? `<button class="btn btn-outline btn-sm" onclick="toggleTask('${tid}',false)">↩ 撤销</button>`
                            : `<button class="btn btn-primary btn-sm" onclick="toggleTask('${tid}',true)">✓ 完成</button>`
                        }
                    </div>
                </div>
            </div>`;
        }).join('');

        const done = sub.tasks.filter((_,ti)=>{const d=data[`${sub.id}_${ti}`];return d&&d.completed;}).length;
        const pct = sub.tasks.length > 0 ? Math.round(done/sub.tasks.length*100) : 0;

        html += `
        <div class="subject-card" id="card_${sub.id}">
            <div class="subject-header" onclick="toggleSubject('${sub.id}')">
                <div class="subject-icon" style="background:${sub.color}18;">${sub.icon}</div>
                <div class="subject-info">
                    <div class="subject-name-row">
                        <span class="subject-name">${esc(sub.name)}</span>
                        <button class="add-task-btn" onclick="event.stopPropagation();addTask('${sub.id}')">+ 新建</button>
                    </div>
                    <div class="subject-progress-text">${done}/${sub.tasks.length} 项完成 (${pct}%)</div>
                    <div class="progress-bar-track">
                        <div class="progress-bar-fill" style="width:${pct}%;background:${sub.color};"></div>
                    </div>
                </div>
                <span class="subject-arrow">▼</span>
            </div>
            <div class="task-list">${tasksHtml}</div>
        </div>`;
    });

    el.innerHTML = html;
    updateStats(data);
}

function getHour(tid){ const d=loadToday()[tid]; return d?parseInt(d.time.split(':')[0]):0; }
function getMin(tid){ const d=loadToday()[tid]; return d?parseInt(d.time.split(':')[1]):0; }

function updateTime(tid, h, m) {
    const data = loadToday();
    if(!data[tid]) data[tid]={completed:false,time:'0:00'};
    data[tid].time = `${Math.min(23,Math.max(0,h))}:${String(Math.min(59,Math.max(0,m))).padStart(2,'0')}`;
    saveToday(data);

    // Immediately sync today's data to history
    const today = todayKey();
    const history = loadHistory();
    const todayEntry = history.find(h => h.date === today);
    if(todayEntry) {
        todayEntry.data = data;
        todayEntry.updatedAt = new Date().toISOString();
    } else {
        history.unshift({date:today, data:data, createdAt:new Date().toISOString(), updatedAt:new Date().toISOString()});
    }
    while(history.length > 120) history.pop();
    saveHistory(history);

    const el = document.querySelector(`#task_${tid} .tv`);
    if(el) el.textContent = data[tid].time;
}

function toggleTask(tid, done) {
    const data = loadToday();
    if(!data[tid]) data[tid]={completed:false,time:'0:00'};
    data[tid].completed = done;
    saveToday(data);

    // Immediately sync today's data to history
    const today = todayKey();
    const history = loadHistory();
    const todayEntry = history.find(h => h.date === today);
    if(todayEntry) {
        todayEntry.data = data;
        todayEntry.updatedAt = new Date().toISOString();
    } else {
        history.unshift({date:today, data:data, createdAt:new Date().toISOString(), updatedAt:new Date().toISOString()});
    }
    while(history.length > 120) history.pop();
    saveHistory(history);

    const taskEl = document.getElementById('task_'+tid);
    if(taskEl) {
        taskEl.classList.toggle('completed', done);
        const action = taskEl.querySelector('.task-action');
        if(action){
            const btn = action.querySelector('button');
            if(btn){
                if(done){ btn.className='btn btn-outline btn-sm'; btn.innerHTML='↩ 撤销'; btn.onclick=()=>toggleTask(tid,false); }
                else    { btn.className='btn btn-primary btn-sm'; btn.innerHTML='✓ 完成'; btn.onclick=()=>toggleTask(tid,true); }
            }
            const tv = action.querySelector('.tv');
            if(tv) tv.textContent = data[tid].time;
        }
    }
    refreshSubjectProgress(tid);
    updateStats(data);
    if (selectedDate === todayKey()) renderChart(selectedDate);
    renderHistMini();
    updateStreak();
    renderStreak();
    if(done) showToast('✅ 任务已完成，继续保持！');
}

function refreshSubjectProgress(tid) {
    const [sid] = tid.split('_');
    const sub = SUBJECTS.find(s=>s.id===sid);
    if(!sub) return;
    const data = loadToday();
    const done = sub.tasks.filter((_,ti)=>{const d=data[`${sub.id}_${ti}`];return d&&d.completed;}).length;
    const pct = sub.tasks.length > 0 ? Math.round(done/sub.tasks.length*100) : 0;
    const textEl = document.querySelector(`#card_${sid} .subject-progress-text`);
    const barEl = document.querySelector(`#card_${sid} .progress-bar-fill`);
    if(textEl) textEl.textContent = `${done}/${sub.tasks.length} 项完成 (${pct}%)`;
    if(barEl) barEl.style.width = pct + '%';
}

function updateStats(data) {
    const done  = Object.values(data).filter(d=>d.completed).length;
    const total = Object.keys(data).length;
    const mins  = Object.entries(data).filter(([,d])=>d.completed&&d.time).reduce((s,[,d])=>{
        const[h,m]=d.time.split(':').map(Number); return s+h*60+m;},0);
    document.getElementById('statDone').textContent = done;
    document.getElementById('statTotal').textContent = total;
    document.getElementById('statTime').textContent  = `${Math.floor(mins/60)}:${String(mins%60).padStart(2,'0')}`;
}

function toggleSubject(id) {
    const cards = document.querySelectorAll('.subject-card');
    cards.forEach(card => {
        const cardId = card.id.replace('card_','');
        if (cardId === id) {
            card.classList.toggle('open');
        } else {
            card.classList.remove('open');
        }
    });
}

/* ═══════════════════════════════════════════
   DELETE TASK
═══════════════════════════════════════════ */
let deleteTarget = null; // { subId, taskIdx }

function deleteTask(subId, taskIdx) {
    const sub = SUBJECTS.find(s=>s.id===subId);
    const taskName = sub.tasks[taskIdx] || '该任务';
    deleteTarget = { subId, taskIdx };
    document.getElementById('deleteMsg').textContent = `确定要删除「${taskName}」吗？此操作不可撤销。`;
    document.getElementById('deleteModal').classList.add('show');
}

function closeDeleteModal() {
    document.getElementById('deleteModal').classList.remove('show');
    deleteTarget = null;
}

document.getElementById('deleteConfirmBtn').addEventListener('click', () => {
    if (!deleteTarget) return;
    const { subId, taskIdx } = deleteTarget;
    const sub = SUBJECTS.find(s=>s.id===subId);
    sub.tasks.splice(taskIdx, 1);

    // Reindex task data
    const data = loadToday();
    const newTasks = [...sub.tasks];
    // Build mapping: old index -> new index
    const keysToDelete = [];
    const keysToRename = [];
    sub.tasks.forEach((_, ti) => {
        const oldTid = `${subId}_${ti}`;
        const oldData = data[oldTid];
        if (oldData) {
            data[`${subId}_${ti}`] = oldData;
        }
    });
    // Remove stale keys beyond new length
    for (let i = newTasks.length; i < 100; i++) {
        const k = `${subId}_${i}`;
        if (data[k]) { delete data[k]; keysToDelete.push(k); }
    }
    saveToday(data);
    closeDeleteModal();
    renderTasks();
    refreshChartAndHistory();
    showToast('🗑️ 任务已删除');
});

document.getElementById('deleteModal').addEventListener('click', e=>{ if(e.target===e.currentTarget) closeDeleteModal(); });

/* ═══════════════════════════════════════════
   ADD / EDIT TASK
═══════════════════════════════════════════ */
let modalMode = '';
function openModal(mode, subId, taskIdx) {
    modalMode = mode;
    modalSubId = subId;
    modalTaskIdx = taskIdx;
    const sub = SUBJECTS.find(s=>s.id===subId);
    const input = document.getElementById('modalInput');
    const title = document.getElementById('modalTitle');
    if(mode==='edit'){
        title.textContent = '✏️ 编辑任务';
        input.value = sub.tasks[taskIdx]||'';
    } else {
        title.textContent = '+ 新建任务';
        input.value = '';
    }
    document.getElementById('taskModal').classList.add('show');
    setTimeout(()=>input.focus(),50);
}
function closeModal() { document.getElementById('taskModal').classList.remove('show'); }
document.getElementById('modalConfirm').addEventListener('click', ()=>{
    const val = document.getElementById('modalInput').value.trim();
    if(!val){ showToast('⚠️ 请输入任务名称'); return; }
    const sub = SUBJECTS.find(s=>s.id===modalSubId);
    if(modalMode==='add'){
        sub.tasks.push(val);
        const data = loadToday();
        const ti = sub.tasks.length-1;
        data[`${sub.id}_${ti}`] = { completed:false, time:'0:00' };
        saveToday(data);
        showToast('✅ 任务已添加');
    } else {
        sub.tasks[modalTaskIdx] = val;
        showToast('✅ 任务已更新');
    }
    closeModal();
    renderTasks();
    refreshChartAndHistory();
});
document.getElementById('taskModal').addEventListener('click', e=>{ if(e.target===e.currentTarget) closeModal(); });
document.getElementById('modalInput').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('modalConfirm').click(); });

function addTask(subId) { openModal('add', subId, -1); }
function editTask(subId, taskIdx) { openModal('edit', subId, taskIdx); }

/* Live-refresh chart + history after any data change */
function refreshChartAndHistory() {
    renderChart(selectedDate || todayKey());
    renderCal();
    renderHistMini();
    renderTrend();
}

/* ═══════════════════════════════════════════
   STREAK DISPLAY
═══════════════════════════════════════════ */
function renderStreak() {
    const streak = loadStreak();
    document.getElementById('streakNum').textContent = streak.current;
}

/* ═══════════════════════════════════════════
   COUNTDOWN
═══════════════════════════════════════════ */
function renderCountdown() {
    const now = new Date();
    const diff = Math.ceil((EXAM_DATE - now) / 86400000);
    document.getElementById('countdownNum').textContent = diff > 0 ? diff : '0';
}

/* ═══════════════════════════════════════════
   CALENDAR
═══════════════════════════════════════════ */
function initCal() {
    const now = new Date();
    calYear = now.getFullYear();
    calMonth = now.getMonth();
    selectedDate = todayKey();
    renderCal();
}

function changeMonth(delta) {
    calMonth += delta;
    if(calMonth>11){calMonth=0;calYear++;}
    if(calMonth<0){calMonth=11;calYear--;}
    renderCal();
}

function renderCal() {
    const label = document.getElementById('calMonthLabel');
    const history = loadHistory();
    const historyMap = {};
    history.forEach(h => { historyMap[h.date] = h; });

    const weekdays = ['日','一','二','三','四','五','六'];
    const grid = document.getElementById('calGrid');

    if(weekViewMode){
        // Week view: show 7 days starting from the previous Sunday
        const today = new Date();
        const todayStr = todayKey();
        const dayOfWeek = today.getDay(); // 0=Sun
        const lastSunday = new Date(today);
        lastSunday.setDate(today.getDate() - dayOfWeek);

        const weekDates = [];
        for(let i=0;i<7;i++){
            const d = new Date(lastSunday);
            d.setDate(lastSunday.getDate() + i);
            weekDates.push(d.toISOString().slice(0,10));
        }

        // Highlight the selected date
        const selIdx = weekDates.indexOf(selectedDate);

        let html = weekdays.map(d=>`<div class="cal-day-header">${d}</div>`).join('');
        weekDates.forEach((ds,i) => {
            const dateObj = new Date(ds+'T00:00:00');
            const day = dateObj.getDate();
            const isToday = ds===todayStr;
            const hasData = historyMap[ds]&&Object.values(historyMap[ds].data).some(d=>d.completed);
            const isSelected = i===selIdx;
            html += `<div class="cal-day${isToday?' today':''}${hasData&&!isToday?' has-data':''}${isSelected&&!isToday?' selected':''}" onclick="selectDate('${ds}')">${day}</div>`;
        });
        label.textContent = '上周学习记录';
        grid.innerHTML = html;
    } else {
        // Month view (original)
        label.textContent = `${calYear}年${calMonth+1}月`;
        const firstDay = new Date(calYear, calMonth, 1).getDay();
        const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
        const todayStr = todayKey();

        let html = weekdays.map(d=>`<div class="cal-day-header">${d}</div>`).join('');

        const prevDays = new Date(calYear, calMonth, 0).getDate();
        for(let i=firstDay-1;i>=0;i--){
            const day = prevDays-i;
            const m = calMonth===0?12:calMonth;
            const y = calMonth===0?calYear-1:calYear;
            const ds = `${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
            const hasData = historyMap[ds]&&Object.values(historyMap[ds].data).some(d=>d.completed);
            html += `<div class="cal-day other-month${hasData?' has-data':''}${ds===selectedDate?' selected':''}" onclick="selectDate('${ds}')">${day}</div>`;
        }

        for(let day=1;day<=daysInMonth;day++){
            const ds = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
            const isToday = ds===todayStr;
            const hasData = historyMap[ds]&&Object.values(historyMap[ds].data).some(d=>d.completed);
            html += `<div class="cal-day${isToday?' today':''}${hasData&&!isToday?' has-data':''}${ds===selectedDate&&!isToday?' selected':''}" onclick="selectDate('${ds}')">${day}</div>`;
        }

        const totalCells = firstDay + daysInMonth;
        const pad = (7 - totalCells%7) % 7;
        for(let day=1;day<=pad;day++){
            const m = calMonth===11?1:calMonth+2;
            const y = calMonth===11?calYear+1:calYear;
            const ds = `${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
            const hasData = historyMap[ds]&&Object.values(historyMap[ds].data).some(d=>d.completed);
            html += `<div class="cal-day other-month${hasData?' has-data':''}${ds===selectedDate?' selected':''}" onclick="selectDate('${ds}')">${day}</div>`;
        }

        grid.innerHTML = html;
    }
    renderLegend();
}

function selectDate(ds) {
    selectedDate = ds;
    renderCal();
    renderChart(ds);
}

function toggleWeekView() {
    weekViewMode = !weekViewMode;
    const btn = document.getElementById('weekBtn');
    if(weekViewMode){
        btn.textContent = '看本月';
        btn.classList.add('active');
        // Set calYear/calMonth to this week's month
        const now = new Date();
        calYear = now.getFullYear();
        calMonth = now.getMonth();
        // Select the start of last week (last Monday)
        const today = new Date();
        const dayOfWeek = today.getDay() || 7; // 1=Mon..7=Sun
        const lastMonday = new Date(today);
        lastMonday.setDate(today.getDate() - dayOfWeek - 6);
        calYear = lastMonday.getFullYear();
        calMonth = lastMonday.getMonth();
        selectedDate = todayKey();
    } else {
        btn.textContent = '看上周';
        btn.classList.remove('active');
        const now = new Date();
        calYear = now.getFullYear();
        calMonth = now.getMonth();
        selectedDate = todayKey();
    }
    renderCal();
}

function renderLegend() {
    document.getElementById('calLegend').innerHTML = SUBJECTS.map(s=>
        `<div class="legend-item"><div class="legend-dot" style="background:${s.color}"></div>${s.name}</div>`
    ).join('');
}

/* ═══════════════════════════════════════════
   DONUT CHART
═══════════════════════════════════════════ */
function renderChart(dateStr) {
    const history = loadHistory();
    let record = history.find(h=>h.date===dateStr);
    if (dateStr === todayKey()) {
        const live = loadToday();
        record = record ? { ...record, data: live } : { date: dateStr, data: live };
    }
    const label = document.getElementById('chartDateLabel');
    const container = document.getElementById('chartContainer');

    if(!record){
        label.textContent = dateStr;
        container.innerHTML = '<div class="chart-no-data">该日期暂无数据，完成任意任务后会自动保存</div>';
        return;
    }

    const dateObj = new Date(dateStr+'T00:00:00');
    const weekday = ['日','一','二','三','四','五','六'][dateObj.getDay()];
    label.textContent = `${dateStr} 周${weekday}`;

    const entries = Object.entries(record.data).filter(([,d])=>d.completed&&d.time);
    if(entries.length===0){
        container.innerHTML = '<div class="chart-no-data">当天没有完成的任务</div>';
        return;
    }

    const subjectTimes = {};
    SUBJECTS.forEach(s => { subjectTimes[s.id] = 0; });
    entries.forEach(([tid,d]) => {
        const [sid] = tid.split('_');
        const [h,m] = d.time.split(':').map(Number);
        if(subjectTimes[sid]!==undefined) subjectTimes[sid] += h*60+m;
    });

    const totalMin = Object.values(subjectTimes).reduce((a,b)=>a+b,0);
    const th = Math.floor(totalMin/60);
    const tm = totalMin%60;
    const barTotalMin = 480; // 8小时为基准
    const rows = SUBJECTS.map(sub => {
        const mins = subjectTimes[sub.id] || 0;
        const pct = Math.round(mins / barTotalMin * 100);
        const h = Math.floor(mins/60), m = mins%60;
        const timeStr = mins > 0 ? `${h}时${m}分` : '—';
        const barColor = mins > 0 ? sub.color : 'var(--gray-200)';
        return `
        <div class="bar-row">
            <div class="bar-label">${sub.icon} ${sub.name}</div>
            <div class="bar-track">
                <div class="bar-fill" style="width:${pct}%;background:${barColor};">
                    ${mins > 0 ? `<span>${pct}%</span>` : ''}
                </div>
            </div>
            <div class="bar-time">${timeStr}</div>
        </div>`;
    }).join('');

    container.innerHTML = `
    <div class="bar-chart">
        <div class="bar-total">
            <div class="total-hours">${th}<span style="font-size:12px;font-weight:500;">h</span></div>
            <div class="total-label">${tm}分钟合计</div>
        </div>
        ${rows}
    </div>`;
}

/* ═══════════════════════════════════════════
   TREND CHART (SVG line chart)
═══════════════════════════════════════════ */
function setTrendRange(n) {
    trendRange = n;
    document.getElementById('trend7Btn').classList.toggle('active', n===7);
    document.getElementById('trend30Btn').classList.toggle('active', n===30);
    renderTrend();
}

function renderTrend() {
    const svg = document.getElementById('trendSvg');
    const W = 320, H = 170;
    const padL = 36, padR = 12, padT = 10, padB = 42;
    const chartW = W - padL - padR;
    const chartH = H - padT - padB;

    const history = loadHistory();
    const today = todayKey();
    const days = [];
    for (let i = trendRange - 1; i >= 0; i--) {
        const d = new Date(Date.now() - i * 86400000);
        days.push(d.toISOString().slice(0,10));
    }

    // Per-subject daily minutes
    const subjectData = SUBJECTS.map(sub => {
        const vals = days.map(ds => {
            let rec = history.find(h => h.date === ds);
            let data;
            if (ds === today) {
                data = loadToday();
                if (rec) data = { ...rec.data, ...data };
            } else {
                data = rec ? rec.data : {};
            }
            return Object.entries(data)
                .filter(([tid, d]) => tid.startsWith(sub.id + '_') && d.completed && d.time)
                .reduce((s, [, d]) => {
                    const [h, m] = d.time.split(':').map(Number);
                    return s + h * 60 + m;
                }, 0);
        });
        return { id: sub.id, color: sub.color, vals };
    });

    const allVals = subjectData.flatMap(s => s.vals);
    const maxVal = Math.max(...allVals, 1);
    const minStep = Math.max(1, Math.floor(trendRange / 7));

    let svgContent = '';

    // Grid lines
    for (let i = 0; i <= 4; i++) {
        const y = padT + (chartH / 4) * i;
        const val = Math.round(maxVal * (4 - i) / 4);
        svgContent += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" class="trend-grid-line"/>`;
        svgContent += `<text x="${padL-4}" y="${y+3}" class="trend-axis-label" text-anchor="end">${val}m</text>`;
    }

    // X-axis labels
    for (let i = 0; i < days.length; i++) {
        if (i % minStep === 0 || i === days.length - 1) {
            const x = padL + (i / (days.length - 1)) * chartW;
            svgContent += `<text x="${x}" y="${H - padB + 12}" class="trend-label" text-anchor="middle">${days[i].slice(5)}</text>`;
        }
    }

    // Per-subject lines and dots
    subjectData.forEach(sub => {
        const points = sub.vals.map((v, i) => {
            const x = padL + (i / (days.length - 1)) * chartW;
            const y = padT + chartH - (v / maxVal) * chartH;
            return { x, y, v, ds: days[i] };
        });

        if (points.length > 1) {
            const pathD = points.map((p, i) => `${i===0?'M':'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
            svgContent += `<path d="${pathD}" stroke="${sub.color}" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
        }

        points.forEach((p, i) => {
            if (i % minStep === 0 || i === points.length - 1) {
                svgContent += `<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="${sub.color}" stroke="white" stroke-width="1.5" cursor="pointer"
                    onmouseenter="showTrendTip(evt,${p.v},'${p.ds}','${sub.name}','${sub.color}')" onmouseleave="hideTrendTip()"/>`;
            }
        });
    });

    // Legend
    const legendY = H - 8;
    let legendX = padL;
    SUBJECTS.forEach(sub => {
        svgContent += `<circle cx="${legendX+4}" cy="${legendY}" r="3" fill="${sub.color}"/>`;
        svgContent += `<text x="${legendX+10}" y="${legendY+3.5}" class="trend-label" font-size="8">${sub.name}</text>`;
        legendX += 52;
    });

    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.innerHTML = svgContent;
}

function showTrendTip(e, mins, ds, name, color) {
    const tip = document.getElementById('trendTooltip');
    const h = Math.floor(mins/60), m = mins%60;
    tip.innerHTML = `<span style="color:${color};font-weight:700;">${name}</span> &nbsp; ${ds} &nbsp; ${h}时${m}分`;
    tip.style.display = 'block';
    const wrap = tip.parentElement;
    const rect = wrap.getBoundingClientRect();
    const svgRect = e.target.getBoundingClientRect();
    tip.style.left = (svgRect.left + svgRect.width/2 - rect.left) + 'px';
    tip.style.top = (svgRect.top - rect.top - 30) + 'px';
}
function hideTrendTip() {
    const tip = document.getElementById('trendTooltip');
    if (tip) tip.style.display = 'none';
}


/* ═══════════════════════════════════════════
   HISTORY MINI
═══════════════════════════════════════════ */
function renderHistMini() {
    const history = loadHistory();
    const el = document.getElementById('histMiniContainer');
    if(history.length===0){
        el.innerHTML='<div class="chart-no-data">暂无历史记录</div>';
        return;
    }
    const recent = history.slice(0,5);
    el.innerHTML = recent.map(rec=>{
        const dateObj = new Date(rec.date+'T00:00:00');
        const day = dateObj.getDate();
        const month = dateObj.getMonth()+1;
        const doneCount = Object.values(rec.data).filter(d=>d.completed).length;
        const total = Object.keys(rec.data).length;
        const totalMin = Object.entries(rec.data).filter(([,d])=>d.completed&&d.time).reduce((s,[,d])=>{
            const[h,m]=d.time.split(':').map(Number); return s+h*60+m;},0);
        const th=Math.floor(totalMin/60), tm=totalMin%60;
        return `
        <div class="hist-mini-item" onclick="selectDate('${rec.date}');renderChart('${rec.date}');">
            <div class="hist-mini-dot" style="background:var(--primary)"></div>
            <span class="hist-mini-date">${month}月${day}日</span>
            <span class="hist-mini-meta">${doneCount}/${total} 项 · ${th}时${tm}分</span>
        </div>`;
    }).join('');
}

/* ═══════════════════════════════════════════
   EXPORT / IMPORT
═══════════════════════════════════════════ */
function exportData() {
    const payload = {
        history: loadHistory(),
        streak: loadStreak(),
        exportDate: new Date().toISOString(),
        subjects: SUBJECTS
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `study-checkin-backup-${todayKey()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('💾 数据已导出');
}

function importData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const payload = JSON.parse(e.target.result);
            if (!payload.history || !payload.streak) {
                showToast('⚠️ 文件格式不正确');
                return;
            }
            if (!confirm('导入将覆盖当前所有数据，确定继续？')) return;
            saveHistory(payload.history);
            saveStreak(payload.streak);
            // Rebuild localStorage with latest history entry as today if dates match
            const today = todayKey();
            const todayRec = payload.history.find(h => h.date === today);
            if (todayRec) saveToday(todayRec.data);
            // Refresh UI
            renderAll();
            showToast('✅ 数据导入成功');
        } catch(err) {
            showToast('⚠️ 解析失败：' + err.message);
        }
    };
    reader.readAsText(file);
    event.target.value = '';
}

/* ═══════════════════════════════════════════
   REMINDER / NOTIFICATION
═══════════════════════════════════════════ */
function loadReminder() {
    const r = localStorage.getItem('checkin_reminder');
    return r ? JSON.parse(r) : { enabled: false, time: '22:00' };
}
function saveReminderData(r) { localStorage.setItem('checkin_reminder', JSON.stringify(r)); }

function initReminder() {
    const r = loadReminder();
    document.getElementById('reminderToggle').checked = r.enabled;
    document.getElementById('reminderTime').value = r.time;
    updateReminderStatus();
    // Start checker
    setInterval(checkReminder, 30000); // every 30s
    checkReminder();
}

function toggleReminder() {
    const r = loadReminder();
    r.enabled = document.getElementById('reminderToggle').checked;
    saveReminderData(r);
    updateReminderStatus();
    if (r.enabled && Notification.permission !== 'granted') {
        Notification.requestPermission().then(p => {
            updateReminderStatus();
        });
    }
}

function saveReminder() {
    const r = loadReminder();
    r.time = document.getElementById('reminderTime').value;
    saveReminderData(r);
    updateReminderStatus();
}

function updateReminderStatus() {
    const r = loadReminder();
    const el = document.getElementById('reminderStatus');
    if (r.enabled) {
        el.textContent = `已开启 · 每天 ${r.time} 提醒打卡`;
    } else {
        el.textContent = '未开启';
    }
}

function checkReminder() {
    const r = loadReminder();
    if (!r.enabled) return;
    const now = new Date();
    const hhmm = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    if (hhmm === r.time) {
        // Fire notification
        if (Notification.permission === 'granted') {
            new Notification('📚 学习打卡提醒', { body: '别忘了今天的任务！', icon: '' });
        } else {
            showToast('🔔 该学习啦！');
        }
    }
}

/* ═══════════════════════════════════════════
   TOAST
═══════════════════════════════════════════ */
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2400);
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ═══════════════════════════════════════════
   INIT
═══════════════════════════════════════════ */
function renderAll() {
    renderTasks();
    initCal();
    renderChart(selectedDate);
    renderHistMini();
    renderStreak();
    renderCountdown();
    renderTrend();
    initReminder();
}

/* ═══════════════════════════════════════════
    AUTO ARCHIVE YESTERDAY'S DATA
═══════════════════════════════════════════ */
function archiveYesterday() {
    const today = todayKey();
    const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
    const yesterdayKey = 'checkin_' + yesterday;

    // Check if yesterday has any data
    const raw = localStorage.getItem(yesterdayKey);
    if (!raw) return; // No data for yesterday

    const history = loadHistory();
    const existingIdx = history.findIndex(h => h.date === yesterday);

    if (existingIdx < 0) {
        // Archive yesterday's data to history
        const data = JSON.parse(raw);
        const hasData = Object.values(data).some(d => d.completed || d.time !== '0:00');
        if (hasData) {
            history.unshift({
                date: yesterday,
                data: data,
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString()
            });
            while (history.length > 120) history.pop();
            saveHistory(history);
        }
    }

    // Update today's entry in history
    const todayEntry = history.find(h => h.date === today);
    const todayData = loadToday();
    if (todayEntry) {
        todayEntry.data = todayData;
        todayEntry.updatedAt = new Date().toISOString();
    } else {
        history.unshift({ date: today, data: todayData, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() });
    }
    while (history.length > 120) history.pop();
    saveHistory(history);
}

function init() {
    const now = new Date();
    const wd = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
    document.getElementById('todayDisplay').textContent =
        `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${wd[now.getDay()]}`;

    // Auto archive yesterday's data
    archiveYesterday();

    // Streak
    updateStreak();
    renderAll();

    // Request notification permission once
    if ('Notification' in window && Notification.permission === 'default') {
        // Don't auto-request; let user enable reminder first
    }
}

init();
